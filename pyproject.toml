[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "speako"
version = "0.1.0"
description = "High-performance Push-to-Talk speech-to-text with provider rotation and local fallback."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Malik Muhammad Awan" }]

dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "pynput>=1.7.7",
    "pyperclip>=1.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
groq = ["groq>=0.11"]
gemini = ["google-genai>=1.0"]
mlx = ["mlx-whisper>=0.4"]
faster = ["faster-whisper>=1.0"]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
speako = "speako.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["speako"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "pynput.*",
    "pyperclip",
    "mlx_whisper",
    "faster_whisper",
    "groq",
    "groq.*",
    "google",
    "google.*",
    "AppKit",           # pyobjc — installed by pynput on macOS, stub-free
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "PL"]
# TCH/TC rules skipped: many imports are used at runtime (isinstance, dataclass
# field types) and rewriting them under TYPE_CHECKING would break execution.
# PLR0911: error-mapping switches naturally have many returns.
# PLR0913: some constructors take many typed config fields.
ignore = ["PLR0911", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
# Lazy SDK imports guard optional-extra deps; global flag is idempotent config.
"speako/util/logging.py" = ["PLW0603"]
"speako/transcribe/groq_engine.py" = ["PLC0415"]
"speako/transcribe/gemini_engine.py" = ["PLC0415"]
"speako/transcribe/local/factory.py" = ["PLC0415"]
"speako/transcribe/local/mlx.py" = ["PLC0415"]
"speako/transcribe/local/faster.py" = ["PLC0415"]
# Rendering helpers take pixel coords — too many named args would obscure them.
# pyobjc AppKit is imported lazily so speako parses on non-macOS platforms.
"speako/ui/hud.py" = ["PLR0917", "PLC0415"]
# Tests: literal magic values and long lines are readable in-context.
"tests/*" = ["PLR2004", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------------------
# Editor tooling
# ---------------------------------------------------------------------------
# The canonical correctness gate is `uv run ruff check` + `uv run mypy --strict`.
# The blocks below tell Pylint and Pyright about our documented conventions
# so editors (VS Code, Cursor) stop flagging noise on:
#   * intentional lazy imports guarding optional per-hardware extras,
#   * dataclass-only modules that we deliberately leave un-docstringed
#     (per AGENT.md — "no unnecessary comments"),
#   * Protocol-required parameters that a given implementation ignores.
# Neither Pylint nor Pyright is required to pass — they exist to keep the
# editor quiet. All disables map to a real, documented convention.

[tool.pylint.main]
py-version = "3.12"
# Optional backends that are only importable on specific hardware. Without
# this list Pylint would flag every reference as E0401 on Intel Mac,
# every reference as E0401 for the other one on Apple Silicon, etc.
ignored-modules = [
    "mlx_whisper",
    "faster_whisper",
    "AppKit",
]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",        # C0114
    "missing-class-docstring",         # C0115  — dataclasses stay undocumented per AGENT.md
    "missing-function-docstring",      # C0116  — same
    "import-outside-toplevel",         # C0415  — lazy imports guard optional deps
    "too-few-public-methods",          # R0903  — dataclasses
    "too-many-instance-attributes",    # R0902
    "too-many-arguments",              # R0913  — duplicates ruff PLR0913
    "too-many-positional-arguments",   # R0917  — duplicates ruff PLR0917
    "line-too-long",                   # C0301  — ruff E501 owns line length
    "duplicate-code",                  # R0801  — noisy across similar test setup
    "unused-argument",                 # W0613  — protocol-required params (also use _prefix)
    "fixme",                           # W0511  — TODO/FIXME are OK during dev
    "too-many-return-statements",      # R0911  — error-mapping switches are naturally many-return
    "broad-exception-caught",          # W0718  — allowed at process/UX boundaries per AGENT.md §6
    "global-statement",                # W0603  — one intentional global flag in util/logging.py
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
# Optional-extra backends may not be installed on every dev machine (e.g.
# mlx-whisper on Intel, faster-whisper on macOS x86_64 without onnxruntime).
# Downgrade from "error" so Pylance shows a hint but doesn't red-underline
# every provider file. Real missing-import bugs will still surface as warnings.
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
